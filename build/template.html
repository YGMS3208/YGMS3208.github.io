<title>自動車製造工程図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   Design tokens
   ink on porcelain for reading, a night stage for the machines.
   ===================================================================== */
:root{
  --bg:#F4F4F2; --paper:#FFFFFF; --soft:#EAEAE7; --ink:#111113; --ink2:#3A3A3F; --muted:#86868B; --hair:rgba(17,17,19,.12); --hair2:rgba(17,17,19,.06);
  --accent:#2D5BFF; --accent-hi:#1E47E0; --on-accent:#FFFFFF;
  --night:#0A0A0B; --night2:#141416; --night3:#202023; --nink:#F5F5F7; --nmuted:#A1A1A6; --nhair:rgba(255,255,255,.14); --naccent:#86A0FF;
  --stage:radial-gradient(120% 100% at 50% 12%,#FFFFFF 0%,#F2F2F1 52%,#E6E6E4 100%);
  --stage-night:radial-gradient(80% 70% at 50% 34%,#2A2B2F 0%,#141416 52%,#0A0A0B 100%);
  --f0:#B36337; --f1:#2D5BFF; --f2:#D1422F; --f3:#16917F; --f4:#8A8F98;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --f-en:"Jost","Futura","Avenir Next","Zen Kaku Gothic New",sans-serif;
  --gn:52px; --wrap:1180px;
  --surface:var(--paper); --line:var(--hair);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B0C; --paper:#151517; --soft:#1D1D20; --ink:#F5F5F7; --ink2:#D2D2D7; --muted:#8E8E93; --hair:rgba(255,255,255,.13); --hair2:rgba(255,255,255,.07);
    --accent:#86A0FF; --accent-hi:#A3B6FF; --on-accent:#0B0B0C;
    --stage:radial-gradient(80% 75% at 50% 30%,#26272B 0%,#151517 55%,#0C0C0D 100%);
    --f0:#E0936A; --f1:#86A0FF; --f2:#F07A68; --f3:#4CC7B3; --f4:#A7ACB4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0C; --paper:#151517; --soft:#1D1D20; --ink:#F5F5F7; --ink2:#D2D2D7; --muted:#8E8E93; --hair:rgba(255,255,255,.13); --hair2:rgba(255,255,255,.07);
  --accent:#86A0FF; --accent-hi:#A3B6FF; --on-accent:#0B0B0C;
  --stage:radial-gradient(80% 75% at 50% 30%,#26272B 0%,#151517 55%,#0C0C0D 100%);
  --f0:#E0936A; --f1:#86A0FF; --f2:#F07A68; --f3:#4CC7B3; --f4:#A7ACB4;
}

/* ===================================================================== base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--gn) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--f-jp);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:.02em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance;letter-spacing:.01em}
p,ol,ul,dl,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.en{font-family:var(--f-en);letter-spacing:.02em}
.tn{font-family:var(--f-en);font-variant-numeric:tabular-nums lining-nums}
.eyebrow{font:500 12px/1.4 var(--f-en);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(20px,4vw,40px)}
.wrap.wide{max-width:1440px}
.d1{font-size:clamp(44px,7.6vw,108px);line-height:1.06;letter-spacing:-.01em;font-weight:700}
.d2{font-size:clamp(34px,5.2vw,68px);line-height:1.12;letter-spacing:-.005em;font-weight:700}
.d3{font-size:clamp(26px,3.3vw,42px);line-height:1.2;font-weight:700}
.sub{font-size:clamp(17px,1.55vw,22px);line-height:1.65;font-weight:500;color:var(--ink2);max-width:40em}
.center{text-align:center;margin-inline:auto}
.nw{display:inline-block}
.lnk{display:inline-flex;align-items:center;gap:.3em;color:var(--accent);font-weight:500}
.lnk::after{content:"";width:.45em;height:.45em;border-right:1.6px solid currentColor;border-top:1.6px solid currentColor;transform:rotate(45deg);margin-left:.1em}
.lnk:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.cta{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 26px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:500;font-size:15px;transition:background .2s}
.cta:hover{background:var(--accent-hi)}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px}
.night{background:var(--night);color:var(--nink);--muted:var(--nmuted);--ink2:#D2D2D7;--hair:var(--nhair);--accent:var(--naccent);--accent-hi:#A3B6FF;--on-accent:#0A0A0B}
.night .ilu{--ink2:#E5E5EA}

/* ===================================================================== global nav */
.gn{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:rgba(10,10,11,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:#E8E8ED}
.gn .in{height:var(--gn);max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;flex:none;color:#F5F5F7}
.brand svg{width:22px;height:22px}
.brand b{font-size:14px;font-weight:700;letter-spacing:.14em}
.brand small{font:500 9.5px var(--f-en);letter-spacing:.34em;color:#9A9AA0;margin-left:4px}
.gn nav{display:flex;gap:2px;margin-inline:auto}
.gn nav a{font-size:13px;padding:6px 12px;color:#D0D0D5;border-radius:999px;transition:color .2s,background .2s}
.gn nav a:hover{color:#FFFFFF}
.gn nav a[aria-current="page"]{color:#FFFFFF;background:rgba(255,255,255,.1)}
.gn .icons{display:flex;gap:6px;margin-left:auto}
.gn nav+.icons{margin-left:0}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#E8E8ED;transition:background .2s}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:17px;height:17px}
.ib.menu{display:none}
@media (max-width:980px){.gn nav{display:none}.ib.menu{display:grid}.brand small{display:none}.gn .icons{margin-left:auto!important}}
.spacer{height:calc(var(--gn) + env(safe-area-inset-top,0px))}

/* overlay: search & menu */
.ov{position:fixed;inset:0;z-index:70;background:rgba(8,8,9,.96);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#F5F5F7;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(20px,5vw,64px) 40px;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility .25s}
.ov.on{opacity:1;visibility:visible}
.ov .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:clamp(12px,3vw,28px)}
.ov .box{max-width:880px;margin:48px auto 0}
.ov input{width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.22);color:#F5F5F7;font:500 clamp(24px,3.6vw,40px)/1.3 var(--f-jp);padding:10px 0 14px;letter-spacing:.02em;border-radius:0}
.ov input:focus{outline:none;border-color:#F5F5F7}
.ov input::placeholder{color:#6E6E73}
.ov .qs{margin-top:28px}
.ov .qs p{font:500 11px var(--f-en);letter-spacing:.3em;color:#8E8E93;margin-bottom:12px}
.ov .qs a{display:block;padding:7px 0;font-size:17px;color:#D2D2D7}
.ov .qs a:hover{color:#FFFFFF}
.ov .mm a{display:block;font-size:clamp(26px,4vw,34px);font-weight:700;padding:6px 0;color:#F5F5F7}
.ov .mm .sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px;margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14)}
.ov .mm .sys a{font-size:16px;font-weight:500;color:#C7C7CC;padding:7px 0}
.ov .mm .sys a span{font:400 12px var(--f-en);color:#8E8E93;margin-right:12px;letter-spacing:.08em}

/* ===================================================================== sections */
main{display:block}
.page.enter{animation:fadein .5s var(--ease) both}
@keyframes fadein{from{opacity:.001}to{opacity:1}}
.sec{padding-block:clamp(84px,10vw,150px)}
.sec.tight{padding-block:clamp(56px,7vw,96px)}
.sec.paper{background:var(--paper)}
.hd{display:flex;flex-direction:column;gap:18px;margin-bottom:clamp(40px,5vw,72px)}
.hd.row{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hd.row>div{display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);padding-top:22px}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{opacity:.5}
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion:no-preference){
    .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
    @keyframes rise{from{transform:translateY(28px) scale(.99)}to{transform:none}}
  }
}

/* stage (where drawings live) */
.stage{background:var(--stage);position:relative;overflow:hidden}
.stage.nt{background:var(--stage-night)}
.stage .ilu{position:relative}
.ilu{-webkit-user-select:none;user-select:none}
.ilu .tbg,.ilu .tbl,.ilu text.ttl{display:none}
.thumb .ilu text,.thumb .ilu .bal,.thumb .ilu .leadl,.thumb .ilu .leadd{display:none}

/* ===================================================================== hero */
.hero{position:relative;overflow:hidden;background:var(--night);padding-top:clamp(52px,7vw,96px)}
.hero .t{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;z-index:2}
.hero .t .sub{color:#A1A1A6}
.hero .ctas{justify-content:center;margin-top:6px}
.hero .v{position:relative;max-width:1060px;margin:clamp(8px,2vw,24px) auto 0;padding-inline:clamp(12px,3vw,32px)}
.hero .v::before{content:"";position:absolute;inset:-10% 0 8% 0;background:radial-gradient(52% 48% at 50% 46%,rgba(120,140,190,.22),rgba(10,10,11,0) 70%);pointer-events:none}
.hero .v .ilu{filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.hero .v .ilu text,.hero .v .ilu .a,.hero .v .ilu .af,.hero .v .ilu .mfe,.tile .vis .ilu .a,.tile .vis .ilu .af,.tile .vis .ilu .mfe,.tile .vis .ilu .chbd{display:none}
.hero .sub{max-width:34em;text-wrap:balance}
.sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:overlay}
.sweep::after{content:"";position:absolute;top:-20%;bottom:-20%;width:26%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-14deg);animation:sweep 7s var(--ease) 1.2s infinite}
@keyframes sweep{0%{left:-30%}55%,100%{left:120%}}
@media (prefers-reduced-motion:reduce){.sweep::after{animation:none;display:none}}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--nhair);margin-top:clamp(20px,4vw,48px)}
.hstats div{padding:26px 8px 34px;text-align:center;display:flex;flex-direction:column;gap:6px}
.hstats div+div{border-left:1px solid var(--nhair)}
.hstats b{font:200 clamp(38px,5vw,64px)/1 var(--f-en);color:#F5F5F7;letter-spacing:.01em}
.hstats span{font-size:13px;color:#A1A1A6;letter-spacing:.1em}
@media (max-width:640px){.hstats{grid-template-columns:1fr 1fr}.hstats div:nth-child(3){border-left:0}.hstats div:nth-child(n+3){border-top:1px solid var(--nhair)}}

/* ===================================================================== segmented control + kpis */
.seg{width:max-content;display:inline-flex;padding:4px;border-radius:999px;background:var(--soft);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:background .25s var(--ease),color .25s}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg button:hover:not([aria-selected="true"]){color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(36px,5vw,64px);border-top:1px solid var(--hair)}
.kpi{padding:28px 6px 8px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi+.kpi{padding-left:clamp(14px,2.4vw,32px);border-left:1px solid var(--hair)}
.kpi .v{font:200 clamp(48px,6vw,84px)/1 var(--f-en);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:14px;color:var(--ink2);font-weight:500}
.kpi .d{font:500 13px var(--f-en);letter-spacing:.06em;color:var(--muted)}
.kpi .d.up{color:var(--f3)} .kpi .d.dn{color:var(--f2)}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0;padding-left:6px}.kpi:nth-child(n+3){border-top:1px solid var(--hair)}}
.ptnote{margin-top:22px;font-size:14px;color:var(--muted);max-width:52em}
.shift{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);margin-top:clamp(48px,6vw,80px)}
@media (max-width:760px){.shift{grid-template-columns:1fr}}
.shift h3{font-size:15px;font-weight:700;padding-bottom:14px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.shift h3 small{font:500 11px var(--f-en);letter-spacing:.24em;color:var(--muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 42% 56px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair2);font-size:14px}
.brow a:hover{color:var(--accent)}
.brow .b{height:6px;border-radius:3px;background:var(--hair2);overflow:hidden}
.brow .b i{display:block;height:100%;border-radius:3px;background:var(--ink);transition:width .6s var(--ease)}
.brow .n{font:500 14px var(--f-en);text-align:right;font-variant-numeric:tabular-nums}
.brow .n small{font-size:12px;opacity:.8}
.brow.up .b i{background:var(--f3)} .brow.up .n{color:var(--f3)}
.brow.dn .b i{background:var(--f2)} .brow.dn .n{color:var(--f2)}
.brow .empty{grid-column:1/-1;color:var(--muted)}
.tdiff{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);margin-top:clamp(40px,5vw,64px)}
.tdiff>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:baseline}
.tdiff b{font:200 clamp(44px,5vw,64px)/1 var(--f-en);grid-row:span 2}
.tdiff b.up{color:var(--f3)} .tdiff b.dn{color:var(--f2)}
.tdiff span{font-size:14px;font-weight:500;color:var(--ink)}
.tdiff p{font-size:13.5px;color:var(--muted);line-height:1.7}
.tdiff p a{color:var(--ink2);border-bottom:1px solid var(--hair)}
.tdiff p a:hover{color:var(--accent)}
@media (max-width:760px){.tdiff{grid-template-columns:1fr}}

/* ===================================================================== carousel */
.carousel{position:relative}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(260px,28vw,340px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:clamp(20px,4vw,40px);padding:6px clamp(20px,4vw,40px) 26px;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
@media (min-width:1260px){.track{padding-inline:calc((100vw - var(--wrap)) / 2 + 40px);scroll-padding-inline:calc((100vw - var(--wrap)) / 2 + 40px)}}
.track.big{grid-auto-columns:clamp(290px,40vw,500px)}
.arrows{display:flex;gap:10px}
.arrows button{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;transition:background .2s,opacity .2s}
.arrows button:hover{background:var(--hair)}
.arrows button:disabled{opacity:.35;cursor:default}
.arrows svg{width:16px;height:16px}
.card{scroll-snap-align:start;display:flex;flex-direction:column;background:var(--paper);border-radius:22px;overflow:hidden;min-width:0;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px -24px rgba(0,0,0,.35)}
.card .stage{aspect-ratio:8/5}
.paper .card{background:var(--bg)}
.card .stage .ilu{height:100%}
.card .tx{padding:20px 22px 24px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .tx .eyebrow{font-size:10.5px;letter-spacing:.26em}
.card h3{font-size:19px;line-height:1.4}
.card p{font-size:13.5px;color:var(--muted);line-height:1.65}
.card .ft{margin-top:auto;padding-top:12px;display:flex;gap:16px;font:500 12.5px var(--f-en);letter-spacing:.08em;color:var(--ink2)}
.card.op .tx h3{font-size:17px}
.card.op .no{font:300 30px/1 var(--f-en);letter-spacing:.02em;color:var(--ink)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}

/* ===================================================================== feature tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(420px,52vw,640px);border-radius:26px;overflow:hidden;background:var(--paper)}
.tile.full{grid-column:1/-1;min-height:clamp(440px,48vw,680px)}
.tile.dk{background:var(--night);color:var(--nink)}
.tile .tx{position:relative;z-index:2;padding:clamp(28px,4vw,52px) clamp(24px,4vw,56px) 0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.tile.full .tx{align-items:center;text-align:center}
.tile .tx .eyebrow{color:var(--muted)}
.tile.dk .tx .eyebrow{color:#8E8E93}
.tile h3{font-size:clamp(28px,3.6vw,48px);line-height:1.15}
.tile .tx p{font-size:16px;color:var(--muted);max-width:30em}
.tile.dk .tx p{color:#A1A1A6}
.tile.dk .lnk{color:var(--naccent)}
.tile .vis{position:relative;margin-top:auto;padding:0 4% 2%}
.tile .vis .ilu text{display:none}
.tile.dk .vis{background:radial-gradient(60% 60% at 50% 55%,rgba(110,130,180,.2),transparent 70%)}
.tile.dk .vis .ilu{filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.tile:not(.dk) .vis .ilu{filter:drop-shadow(0 26px 30px rgba(0,0,0,.14))}
.tile.full .vis{max-width:900px;margin-inline:auto;width:100%}
@media (max-width:760px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}

/* ===================================================================== lists */
.list{border-top:1px solid var(--ink)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 2px;border-bottom:1px solid var(--hair);font-size:15px}
a.li:hover .t{color:var(--accent)}
.li .n{font:400 14px var(--f-en);color:var(--muted);font-variant-numeric:tabular-nums}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px)}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.h4{font:500 11px var(--f-en);letter-spacing:.3em;color:var(--muted);padding-bottom:12px;text-transform:uppercase}

/* ===================================================================== system / part */
.phero{padding-top:clamp(28px,5vw,64px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.phero .sub{margin-inline:auto}
.phero .eyebrow a:hover{color:var(--ink)}
.phero .mat{font-size:14px;color:var(--muted);max-width:44em}
.pvis{max-width:980px;margin:clamp(24px,4vw,48px) auto 0}
.pvis .stage{border-radius:28px;padding:clamp(8px,2vw,24px)}
.pvis .ilu{filter:drop-shadow(0 30px 40px rgba(0,0,0,.14))}
.pvis .ilu text{display:none}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-top:clamp(40px,6vw,80px)}
.specs>div{padding:26px clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:8px;min-width:0}

<script type="application/json" id="d">__DATA__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("d").textContent);
var K = D.kinds, C = D.cats, G = D.groups, MATS = D.mats, ILL = D.ill, PT = D.pt;
var view = document.getElementById("view"), qIn = document.getElementById("q");
var state = { q: "", eqf: "", eqg: -1, pt: 4, onlyDiff: true };
var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- families ---------- */
var FAM = [
  { n: "成形", en: "FORMING", k: ["素材", "鋳造", "鍛造", "プレス", "成形"] },
  { n: "除去加工", en: "MACHINING", k: ["切削", "研削", "歯車"] },
  { n: "熱・表面", en: "HEAT & SURFACE", k: ["熱処理", "表面処理", "塗装", "化学"] },
  { n: "接合・組立", en: "JOIN & ASSEMBLE", k: ["接合", "巻線", "組立", "電子"] },
  { n: "検査・物流", en: "QUALITY & FLOW", k: ["検査", "物流", "保全"] }
];
var KF = K.map(function(k){ for(var i = 0; i < FAM.length; i++) if(FAM[i].k.indexOf(k.n) >= 0) return i; return 4; });
var MACH = { "切削": 1, "研削": 1, "歯車": 1 };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function fmt(n){ return Math.round(n).toLocaleString("ja-JP"); }
function kchip(ki){ return "<span class=\"kchip f" + KF[ki] + "\"><i></i>" + esc(K[ki].n) + "</span>"; }

/* ---------- indexes ---------- */
var sysById = {}, parts = [], ops = [], partByKey = {};
var INDS = D.inds || [], indById = {};
INDS.forEach(function(d){ indById[d.id] = d; });
function indOf(s){ return indById[s.ind] || INDS[0]; }
function sysIn(id){ return D.systems.filter(function(s){ return s.ind === id; }); }
function indName(d){ return d.short || d.n; }
D.systems.forEach(function(s, si){
  s.si = si; sysById[s.id] = s;
  s.parts.forEach(function(p){ p.s = s; parts.push(p); partByKey[s.id + "." + p.id] = p; p.ops.forEach(function(o, i){ o.p = p; o.i = i; ops.push(o); }); });
});
var use = C.map(function(){ return []; });
ops.forEach(function(o){
  o.m.forEach(function(r){ use[r[0]].push({ o: o, r: r, role: "m" }); });
  o.x.forEach(function(r){ use[r[0]].push({ o: o, r: r, role: "i" }); });
});
var measureStart = G.indexOf("寸法・形状測定");
function isMachineGroup(g){ return g < measureStart; }
function pkey(p){ return p.s.id + "." + p.id; }
function partsOf(ci){ var seen = {}, n = 0; use[ci].forEach(function(u){ var k = pkey(u.o.p); if(!seen[k]){ seen[k] = 1; n++; } }); return n; }
function uniq(list){ var s = {}, out = []; list.forEach(function(x){ if(!s[x]){ s[x] = 1; out.push(x); } }); return out; }

/* ---------- materials: the first material named in the part's spec decides the finish ---------- */
var MTK = [["mt-al", ["アルミ", "ADC", "A6", "AC2"]], ["mt-fe", ["鋳鉄", "FC2", "FCD"]], ["mt-pl", ["樹脂", "PP", "PA6", "PBT", "ABS", "ゴム", "ウレタン", "EPDM", "ポリ", "ナイロン", "フェノール"]], ["mt-cu", ["銅"]]];
function mcls(p){
  if(!p) return "";
  var t = p.mat || "", best = "", bi = 1e9;
  MTK.forEach(function(m){ m[1].forEach(function(w){ var i = t.indexOf(w); if(i >= 0 && i < bi){ bi = i; best = m[0]; } }); });
  ["鋼", "SCM", "SCr", "S45C", "SUJ", "ステンレス", "鉄"].forEach(function(w){ var i = t.indexOf(w); if(i >= 0 && i < bi){ bi = i; best = ""; } });
  return best;
}

/* ---------- drawings ---------- */
function svgw(body, label, cls, vb){ return "<svg class=\"ilu " + (cls || "") + "\" viewBox=\"" + (vb || "0 0 320 200") + "\" role=\"img\" aria-label=\"" + esc(label) + "\">" + (body || "") + "</svg>"; }
function partPic(p){ var b = ILL.p[pkey(p)]; return b ? svgw(b, p.name + "のイメージ", mcls(p)) : ""; }
function opCat(o){ var r = o.m[0] || o.x[0]; return r ? r[0] : -1; }
function opPic(o){ var ci = opCat(o); if(ci < 0) return ""; return svgw(ILL.q[o.pic || C[ci].pi], o.n + "の原理図（" + C[ci].n + "）", mcls(o.p)); }
function catPic(ci){ return svgw(ILL.q[C[ci].pi], C[ci].n + "の原理図"); }
function heroPic(s){ var b = ILL.p[s.hero]; return b ? svgw(b, s.name + "の代表部品", mcls(partByKey[s.hero])) : ""; }
function hasD(p){ return !!(ILL.d && ILL.d[pkey(p)]); }
function opDraw(o){ var a = ILL.o && ILL.o[pkey(o.p)]; return a && a[o.i] != null ? svgw(ILL.pool[a[o.i]], opNo(o) + " " + o.n + "の工程図", mcls(o.p), "0 0 480 300") : ""; }
function detPic(p){ return hasD(p) ? svgw(ILL.d[pkey(p)].svg, p.name + "の詳細図", mcls(p), "0 0 480 300") : ""; }
function bigPic(k, label){ return svgw(ILL.h[k], label, "", "0 0 640 400"); }
var LEG = (function(){
  function sv(b){ return "<svg class=\"ilu\" viewBox=\"0 0 34 14\" aria-hidden=\"true\">" + b + "</svg>"; }
  return "<ul class=\"legend\">" +
    "<li>" + sv("<line class=\"mf\" x1=\"3\" y1=\"7\" x2=\"31\" y2=\"7\"/>") + "この工程の加工面</li>" +
    "<li>" + sv("<rect class=\"cut\" x=\"3\" y=\"2\" width=\"28\" height=\"10\"/>") + "断面（切った面）</li>" +
    "<li>" + sv("<rect class=\"t\" x=\"3\" y=\"3\" width=\"28\" height=\"8\" rx=\"1\"/>") + "工具・金型</li>" +
    "<li>" + sv("<rect class=\"w\" x=\"3\" y=\"3\" width=\"28\" height=\"8\" rx=\"1\"/>") + "加工する部品</li>" +
    "<li>" + sv("<line class=\"a\" x1=\"3\" y1=\"7\" x2=\"26\" y2=\"7\"/><polygon class=\"af\" points=\"31,7 24,3 24,11\"/>") + "工具・部品の動き</li>" +
    "<li>" + sv("<polygon class=\"loc\" points=\"17,12 11,3 23,3\"/>") + "位置決め（基準）</li>" +
    "<li>" + sv("<line class=\"clampl\" x1=\"3\" y1=\"7\" x2=\"24\" y2=\"7\"/><polygon class=\"clamph\" points=\"31,7 23,3 23,11\"/>") + "クランプ</li>" +
    "<li>" + sv("<line class=\"hid\" x1=\"2\" y1=\"7\" x2=\"32\" y2=\"7\"/>") + "かくれ線（内部）</li></ul>";
})();

/* ---------- links ---------- */
function hs(s){ return "#s-" + s.id; }
function hi(d){ return "#i-" + d.id; }
function hp(p){ return "#p-" + p.s.id + "-" + p.id; }
function ho(o){ return "#o-" + o.p.s.id + "-" + o.p.id + "-" + (o.i + 1); }
function he(ci){ return "#e-" + ci; }
function hk(ki){ return "#k-" + ki; }
function opNo(o){ return "OP" + ((o.i + 1) * 10); }
function opsOfKind(ki){ return ops.filter(function(o){ return o.k === ki; }); }
function sysOps(s){ var n = 0; s.parts.forEach(function(p){ n += p.ops.length; }); return n; }
function crumb(items){
  if(!items) return "";
  var h = "<nav class=\"wrap crumbs\" aria-label=\"現在地\"><a href=\"#top\">トップ</a>";
  items.forEach(function(it){ h += "<span class=\"sep\">/</span>" + (it[1] ? "<a href=\"" + it[1] + "\">" + esc(it[0]) + "</a>" : "<span>" + esc(it[0]) + "</span>"); });
  return h + "</nav>";
}
function show(html, cr, nav){
  view.innerHTML = "<div class=\"page enter\">" + crumb(cr) + html + "</div>";
  document.querySelectorAll("[data-nav]").forEach(function(a){ if(a.getAttribute("data-nav") === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  wireCarousels();
}
var CHEV_L = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg>";
var CHEV_R = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/></svg>";
function arrowsFor(id){ return "<div class=\"arrows\"><button type=\"button\" data-car=\"" + id + "\" data-dir=\"-1\" aria-label=\"前へ\">" + CHEV_L + "</button><button type=\"button\" data-car=\"" + id + "\" data-dir=\"1\" aria-label=\"次へ\">" + CHEV_R + "</button></div>"; }
function wireCarousels(){
  view.querySelectorAll(".track").forEach(function(t){
    function upd(){ var bs = view.querySelectorAll("[data-car=\"" + t.id + "\"]"); if(bs.length === 2){ bs[0].disabled = t.scrollLeft < 4; bs[1].disabled = t.scrollLeft + t.clientWidth > t.scrollWidth - 4; } }
    t.addEventListener("scroll", upd, { passive: true }); upd();
  });
}

/* ---------- powertrain metrics ---------- */
var TY = PT.types;
function qOf(p, ti){ var q = PT.q[pkey(p)]; return q ? q[ti] : 0; }
var MET = TY.map(function(t, ti){
  var pres = parts.filter(function(p){ return qOf(p, ti) > 0; });
  var nops = 0, mops = 0, vol = 0, eq = {}, grp = {}, fam = [0, 0, 0, 0, 0];
  pres.forEach(function(p){
    var q = qOf(p, ti);
    p.ops.forEach(function(o){
      nops++; fam[KF[o.k]]++;
      if(MACH[K[o.k].n]){ mops++; vol += q; }
      o.m.forEach(function(r){ eq[r[0]] = (eq[r[0]] || 0) + q; grp[C[r[0]].g] = (grp[C[r[0]].g] || 0) + q; });
    });
  });
  return { parts: pres.length, ops: nops, mops: mops, vol: vol, eq: eq, grp: grp, fam: fam };
});
var BASE = MET[0];
function pct(v, b){ return b ? Math.round((v - b) / b * 100) : 0; }
function delta(v, b){ var d = pct(v, b); return d === 0 ? "±0%" : (d > 0 ? "+" : "−") + Math.abs(d) + "%"; }
function dcls(v, b){ var d = v - b; return d > 0 ? "up" : d < 0 ? "dn" : ""; }
function volIdx(ti){ return Math.round(MET[ti].vol / BASE.vol * 100); }
function shiftRows(ti, n){
  var diffs = [];
  C.forEach(function(c, ci){ if(!isMachineGroup(c.g)) return; var a = BASE.eq[ci] || 0, b = MET[ti].eq[ci] || 0; if(a !== b) diffs.push({ ci: ci, d: b - a }); });
  var up = diffs.filter(function(x){ return x.d > 0; }).sort(function(a, b){ return b.d - a.d; }).slice(0, n);
  var dn = diffs.filter(function(x){ return x.d < 0; }).sort(function(a, b){ return a.d - b.d; }).slice(0, n);
  var mx = 1; up.concat(dn).forEach(function(x){ mx = Math.max(mx, Math.abs(x.d)); });
  function rows(list, cls){
    if(!list.length) return "<div class=\"brow\"><span class=\"empty\">ガソリン車との差はありません</span></div>";
    return list.map(function(x){ return "<div class=\"brow " + cls + "\"><a href=\"" + he(x.ci) + "\">" + esc(C[x.ci].n) + "</a><span class=\"b\"><i style=\"width:" + (Math.abs(x.d) / mx * 100).toFixed(1) + "%\"></i></span><span class=\"n\">" + (x.d > 0 ? "+" : "−") + Math.abs(x.d) + "</span></div>"; }).join("");
  }
  return { up: rows(up, "up"), dn: rows(dn, "dn") };
}
function typeDiff(ti){
  var add = [], gone = [];
  C.forEach(function(c, ci){ if(!isMachineGroup(c.g)) return; var a = BASE.eq[ci] || 0, b = MET[ti].eq[ci] || 0; if(!a && b) add.push(ci); if(a && !b) gone.push(ci); });
  add.sort(function(x, y){ return (MET[ti].eq[y] || 0) - (MET[ti].eq[x] || 0); });
  gone.sort(function(x, y){ return (BASE.eq[y] || 0) - (BASE.eq[x] || 0); });
  function names(l){ return l.slice(0, 5).map(function(ci){ return "<a href=\"" + he(ci) + "\">" + esc(C[ci].n) + "</a>"; }).join("、") + (l.length > 5 ? " ほか" : ""); }
  return "<div class=\"tdiff\"><div><b class=\"tn up\">" + (add.length ? "+" : "") + add.length + "</b><span>新たに必要になる設備の種類</span><p>" + (add.length ? names(add) : "なし") + "</p></div><div><b class=\"tn dn\">" + (gone.length ? "−" : "") + gone.length + "</b><span>使わなくなる設備の種類</span><p>" + (gone.length ? names(gone) : "なし") + "</p></div></div>";
}
function ptSeg(id){ return "<div class=\"seg\" role=\"tablist\" aria-label=\"パワートレイン\" id=\"" + id + "\">" + TY.map(function(t, ti){ return "<button type=\"button\" role=\"tab\" data-pt=\"" + ti + "\" aria-selected=\"" + (ti === state.pt) + "\">" + esc(t.n) + "</button>"; }).join("") + "</div>"; }
function kpiBlock(ti){
  var m = MET[ti];
  function k(v, b, l){ return "<div class=\"kpi\"><span class=\"v\" data-to=\"" + v + "\">" + fmt(v) + "</span><span class=\"l\">" + l + "</span><span class=\"d " + (ti ? dcls(v, b) : "") + "\">" + (ti === 0 ? "基準" : "ガソリン車比 " + delta(v, b)) + "</span></div>"; }
  return k(m.parts, BASE.parts, "部品の種類") + k(m.ops, BASE.ops, "工程") + k(m.mops, BASE.mops, "機械加工の工程") + k(volIdx(ti), 100, "機械加工のボリューム（ガソリン車＝100）");
}
function countUp(root){
  if(RM) return;
  root.querySelectorAll("[data-to]").forEach(function(el){
    var to = +el.getAttribute("data-to"), from = +(el.getAttribute("data-from") || 0), t0 = null;
    if(from === to) return;
    function step(ts){ if(t0 === null) t0 = ts; var k = Math.min(1, (ts - t0) / 650), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if(k < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });
}
function renderPtHome(){
  var box = document.getElementById("ptbox"); if(!box) return;
  var prev = box.querySelectorAll("[data-to]");
  var sh = shiftRows(state.pt, 6), t = TY[state.pt];
  box.innerHTML = "<div class=\"kpis\">" + kpiBlock(state.pt) + "</div><p class=\"ptnote\"><b>" + esc(t.spec) + "</b>　" + esc(t.note) + "</p>" +
    (state.pt === 0 ? "" : typeDiff(state.pt) + "<div class=\"shift\"><div><h3>増える設備<small>MORE</small></h3>" + sh.up + "</div><div><h3>減る設備<small>LESS</small></h3>" + sh.dn + "</div></div>");
  var now = box.querySelectorAll("[data-to]");
  now.forEach(function(el, i){ if(prev[i]) el.setAttribute("data-from", prev[i].getAttribute("data-to")); else el.setAttribute("data-from", el.getAttribute("data-to")); });
  countUp(box);
  document.querySelectorAll("#seg1 button").forEach(function(b){ b.setAttribute("aria-selected", String(+b.getAttribute("data-pt") === state.pt)); });
}

/* ---------- home ---------- */
function home(){
  var h = "<section class=\"hero night\"><div class=\"wrap t\"><p class=\"eyebrow\">MANUFACTURING PROCESS ATLAS</p><h1 class=\"d1\"><span class=\"nw\">ものは、</span><br><span class=\"nw\">工程で</span><span class=\"nw\">できている。</span></h1>" +
    "<p class=\"sub\">クルマ、船のエンジン、データセンターの非常用発電機。部品をつくる工程と、そこで働く工作機械・検査機を、ひとつずつ解き明かす図鑑。</p>" +
    "<p class=\"ctas\"><a class=\"cta\" href=\"#industries\">業界から見る</a><a class=\"lnk\" href=\"#systems\">部品を見る</a></p></div>" +

  h += "<section class=\"sec\" id=\"industries\"><div class=\"wrap\"><div class=\"hd\"><p class=\"eyebrow\">INDUSTRIES</p><h2 class=\"d2\">" + INDS.length + "つの業界を、工程で読む。</h2><p class=\"sub\">同じ旋盤やマシニングセンタでも、業界が変われば、部品の大きさも、つくる数も、品質の確かめ方も変わります。</p></div><div class=\"grid-cards\">" + INDS.map(indCard).join("") + "</div></div></section>";

  h += "<section class=\"sec paper\"><div class=\"wrap\"><div class=\"hd\" style=\"align-items:center;text-align:center\"><p class=\"eyebrow\">AUTOMOTIVE · POWERTRAIN</p><h2 class=\"d2\"><span class=\"nw\">パワートレインが</span><span class=\"nw\">変われば、</span><br><span class=\"nw\">工場が変わる。</span></h2><p class=\"sub center\">ガソリン、ディーゼル、ハイブリッド、軽自動車、電気自動車。必要な部品と工程、そして工作機械の顔ぶれを比べます。</p>" + ptSeg("seg1") + "</div><div id=\"ptbox\"></div><p style=\"margin-top:48px;text-align:center\"><a class=\"lnk\" href=\"#pt\">すべての比較を見る</a></p></div></section>";

  h += "<section class=\"sec\"><div class=\"hd row wrap\"><div><p class=\"eyebrow\">SYSTEMS</p><h2 class=\"d2\">系統から、部品へ。</h2><p class=\"sub\">" + D.systems.length + "の系統、" + parts.length + "の部品。気になるところから開いてください。</p></div>" + arrowsFor("car1") + "</div>" +
    "<div class=\"carousel\"><div class=\"track\" id=\"car1\">" + D.systems.map(sysCard).join("") + "</div></div></section>";

  var feat = [
    ["full dk", "grind", "PRECISION", "歯車は、磨かれて静かになる。", "焼入れで硬くなった歯面を、ねじ状の砥石で数μmまで削り整える。モータ駆動の静けさを支える工程です。", "#o-drivetrain-gear-11"],
    ["", "p:ev.batcase", "ELECTRIFICATION", "電池を、守る箱。", "長さ2m級のアルミ押出材を、溶かさずに接合する。衝突と水から電池を守る筐体です。", "#p-ev-batcase"],
    ["", "p:ev.stator", "MOTOR", "銅線を、ヘアピンで。", "平角線をU字に曲げて差し込み、数百か所を溶接する。モータの効率を決める工程です。", "#p-ev-stator"],
    ["dk", "pair", "DRIVE", "曲がった歯で、力を曲げる。", "リングギヤとピニオンをペアで仕上げる、ハイポイドギヤ。", "#p-drivetrain-hypoid"],
    ["dk", "mesh", "QUALITY", "音で、確かめる。", "マスタギヤとかみ合わせ、伝達誤差と騒音を全数判定する。", "#o-drivetrain-gear-12"],
    ["", "p:marine2.m2crank", "MARINE", "クランク軸を、熱ではめる。", "長さ10m超、数十t以上の軸を、熱で広げた穴にはめて組み立てる。キーを使わず、締め代の摩擦だけで力を伝えます。", "#p-marine2-m2crank"],
    ["", "p:gasgen.gtblade", "POWER", "結晶をそろえて、熱に耐える。", "1,000℃を大きく超えるガスの中で回るタービン動翼。結晶の向きをそろえた超合金を鋳造し、冷却孔と遮熱コーティングで守ります。", "#p-gasgen-gtblade"]
  ];
  h += "<section class=\"sec\"><div class=\"wrap\"><div class=\"hd\"><p class=\"eyebrow\">HIGHLIGHTS</p><h2 class=\"d2\">工程の、見どころ。</h2></div><div class=\"tiles\">";

document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeOv); });
document.getElementById("mm").innerHTML = "<a href=\"#top\">トップ</a>" + INDS.map(function(d){ return "<a href=\"" + hi(d) + "\">" + esc(d.n) + "</a>"; }).join("") + "<a href=\"#systems\">系統</a><a href=\"#pt\">パワートレイン比較</a><a href=\"#map\">工程マップ</a><a href=\"#kinds\">加工法</a><a href=\"#eq\">設備</a><div class=\"sys\">" + D.systems.map(function(s, si){ return "<a href=\"" + hs(s) + "\"><span>" + pad(si + 1) + "</span>" + esc(s.name) + "</a>"; }).join("") + "</div>";
document.getElementById("qs").innerHTML = "<p>QUICK LINKS</p>" + ["ホブ盤", "バッテリケース", "ヘアピン", "レゾルバ", "オークマ", "ライスハウアー", "三井精機工業", "ギガキャスト", "浸炭"].map(function(x){ return "<a href=\"#q\" data-q=\"" + esc(x) + "\">" + esc(x) + "</a>"; }).join("");

/* ---------- router ---------- */
function findPart(sid, pid){ var s = sysById[sid]; if(!s) return null; for(var i = 0; i < s.parts.length; i++) if(s.parts[i].id === pid) return s.parts[i]; return null; }
function routeTo(){
  var h = location.hash.replace(/^#/, ""), m;
  try { h = decodeURIComponent(h); } catch(e){}
  if(!h || h === "top") home();
  else if(h === "systems") systemsView();
  else if(h === "pt") ptView();
  else if(h === "map") mapView();
  else if(h === "eq") eqIndex();
  else if(h === "kinds") kindsView();
  else if(h === "q") searchView();
  else if((m = h.match(/^s-(\w+)$/)) && sysById[m[1]]) sysView(sysById[m[1]]);
  else if((m = h.match(/^i-(\w+)$/)) && indById[m[1]]) industryView(indById[m[1]]);
  else if((m = h.match(/^p-(\w+?)-(\w+)$/)) && findPart(m[1], m[2])) partView(findPart(m[1], m[2]));
  else if((m = h.match(/^o-(\w+?)-(\w+?)-(\d+)$/)) && findPart(m[1], m[2]) && findPart(m[1], m[2]).ops[+m[3] - 1]) opView(findPart(m[1], m[2]).ops[+m[3] - 1]);
  else if((m = h.match(/^e-(\d+)$/)) && C[+m[1]]) eqView(+m[1]);
  else if((m = h.match(/^k-(\d+)$/)) && K[+m[1]]) kindView(+m[1]);
  else if((m = h.match(/^m-(\d+)$/)) && MATS[+m[1]]) matView(+m[1]);
  else home();
}
var lastHash = null;
window.addEventListener("hashchange", function(){
  var jump = location.hash !== "#q" || lastHash !== "#q";
  lastHash = location.hash;
  if(location.hash !== "#q") closeOv();
  routeTo();
  if(jump) window.scrollTo(0, 0);
});
document.addEventListener("click", function(e){
  var t = e.target; if(!t || !t.closest) return;
  var a = t.closest("[data-q]");
  if(a){ e.preventDefault(); state.q = a.getAttribute("data-q"); qIn.value = state.q; closeOv(); if(location.hash !== "#q") location.hash = "q"; else { searchView(); window.scrollTo(0, 0); } return; }
  var b = t.closest("button[data-g]");
  if(b){ state.eqg = +b.getAttribute("data-g"); renderEqList(); return; }
  var p = t.closest("[data-pt]");
  if(p){ state.pt = +p.getAttribute("data-pt"); if(document.getElementById("ptbox")) renderPtHome(); if(document.getElementById("shiftbox")){ renderShift(); if(p.closest(".cc")) document.getElementById("shift").scrollIntoView({ behavior: RM ? "auto" : "smooth" }); } return; }
  var c = t.closest("[data-car]");
  if(c){ var tr = document.getElementById(c.getAttribute("data-car")); if(tr) tr.scrollBy({ left: +c.getAttribute("data-dir") * tr.clientWidth * .8, behavior: RM ? "auto" : "smooth" }); return; }
  if(t.closest(".mm a") || t.closest("#qs a")) closeOv();
});
document.addEventListener("change", function(e){ if(e.target && e.target.id === "onlydiff"){ state.onlyDiff = e.target.checked; renderMatrix(); } });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeOv();
  if(e.key === "/" && !/input|textarea/i.test((document.activeElement || {}).tagName || "")){ e.preventDefault(); openOv(sov); }
});
var QUICK = document.getElementById("qs").innerHTML;
function suggest(){
  var q = qIn.value.trim().toLowerCase(), box = document.getElementById("qs");
  if(!q){ box.innerHTML = QUICK; return; }
  var out = [];
  parts.forEach(function(p){ if(out.length < 5 && (p.name.toLowerCase().indexOf(q) >= 0 || p.mat.toLowerCase().indexOf(q) >= 0)) out.push("<a href=\"" + hp(p) + "\">" + hl(p.name, q) + " <small style=\"color:#8E8E93\">部品</small></a>"); });
  C.forEach(function(c, ci){ if(out.length < 9 && c.n.toLowerCase().indexOf(q) >= 0) out.push("<a href=\"" + he(ci) + "\">" + hl(c.n, q) + " <small style=\"color:#8E8E93\">設備</small></a>"); });
  ops.forEach(function(o){ if(out.length < 12 && o.n.toLowerCase().indexOf(q) >= 0) out.push("<a href=\"" + ho(o) + "\">" + hl(o.n, q) + " <small style=\"color:#8E8E93\">" + esc(o.p.name) + "・" + opNo(o) + "</small></a>"); });
  box.innerHTML = "<p>SUGGESTIONS</p>" + (out.join("") || "<a href=\"#q\" data-q=\"" + esc(qIn.value.trim()) + "\">「" + esc(qIn.value.trim()) + "」で全体を検索</a>") + (out.length ? "<a href=\"#q\" data-q=\"" + esc(qIn.value.trim()) + "\" style=\"margin-top:10px;color:#A3B6FF\">すべての結果を見る</a>" : "");
}
qIn.addEventListener("input", suggest);
qIn.addEventListener("keydown", function(e){ if(e.key === "Enter"){ state.q = qIn.value.trim(); closeOv(); if(location.hash !== "#q") location.hash = "q"; else searchView(); } });
lastHash = location.hash;
routeTo();
})();
</script>
