# Tell search engines (Bing, Yandex, Naver, Seznam via IndexNow) which pages changed, right after each publish.
# Google does not take IndexNow; it reads sitemap.xml (register it once in Search Console).
name: indexnow
on:
  push:
    branches: [main]
    paths: ["**/*.html", "sitemap*.xml"]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed indexable pages
        run: |
          git diff --name-only HEAD~1 HEAD -- '*.html' > changed.txt || true
          python3 - <<'PY'
          import json, re
          host = "ygms3208.github.io"
          urls = []
          for p in open("changed.txt").read().split():
              try:
                  head = open(p, encoding="utf-8").read(4000)
              except FileNotFoundError:
                  continue
              if 'content="noindex' in head or not p.endswith("index.html"):
                  continue
              urls.append(f"https://{host}/" + p[: -len("index.html")])
          urls = urls[:10000]
          json.dump({"host": host, "key": "ef767ae714645ac66d1a5b3a3af7d15e",
                     "keyLocation": f"https://{host}/ef767ae714645ac66d1a5b3a3af7d15e.txt", "urlList": urls},
                    open("payload.json", "w"), ensure_ascii=False)
          print(len(urls), "urls")
          PY
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit to IndexNow
        run: |
          n=$(python3 -c "import json;print(len(json.load(open('payload.json'))['urlList']))")
          if [ "$n" -gt 0 ]; then
            curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" --data @payload.json
          else
            echo "no indexable page changed"
          fi
