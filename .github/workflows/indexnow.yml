# Tell search engines (Bing, Yandex, Naver, Seznam via IndexNow) which pages changed, right after each publish.
# Google does not take IndexNow; it reads sitemap.xml (register it once in Search Console).
name: indexnow
on:
  push:
    branches: [main]
    paths: ["**/*.html", "sitemap*.xml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect changed indexable pages
        run: |
          git diff --name-only HEAD~1 HEAD -- '*.html' > changed.txt || true
          python3 - <<'PY'
          import json, re
          host = "ygms3208.github.io"
          urls = []
          for p in open("changed.txt").read().split():
              try:
                  head = open(p, encoding="utf-8").read(4000)
              except FileNotFoundError:
                  continue
              if 'content="noindex' in head or not p.endswith("index.html"):
                  continue
              urls.append(f"https://{host}/" + p[: -len("index.html")])
          import os, glob
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              urls = sorted({u for f in glob.glob("sitemap-*.xml") for u in re.findall(r"<loc>([^<]+)</loc>", open(f).read())})
          urls = urls[:10000]
          json.dump({"host": host, "key": "ef767ae714645ac66d1a5b3a3af7d15e",
                     "keyLocation": f"https://{host}/ef767ae714645ac66d1a5b3a3af7d15e.txt", "urlList": urls},
                    open("payload.json", "w"), ensure_ascii=False)
          print(len(urls), "urls")
          PY
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 120
      - name: Submit to IndexNow
        run: |
          echo "key file as served:"; curl -sS -L -w "  (HTTP %{http_code})\n" https://ygms3208.github.io/ef767ae714645ac66d1a5b3a3af7d15e.txt
          n=$(python3 -c "import json;print(len(json.load(open('payload.json'))['urlList']))")
          if [ "$n" -eq 0 ]; then echo "no indexable page changed"; exit 0; fi
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST https://www.bing.com/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @payload.json)
          echo "IndexNow HTTP $code ($n urls)"; cat resp.txt; echo
          case "$code" in
            200|202) ;;
            *) if grep -q SiteVerificationNotCompleted resp.txt; then
                 echo "::warning::IndexNow is still verifying this site's key; the next publish will retry."
               else exit 1; fi ;;
          esac
